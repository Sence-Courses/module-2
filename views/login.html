<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>Inicio de sesion</h2>
    </header>
    <main>
      <form id="loginForm" novalidate>
        <div class="form-group mb-2 mt-2">
          <i class="fa-solid fa-envelope"></i>
          <label for="email">Email:</label>
          <input class="form-control" id="email" type="email" required>
          <span class="error-message" id="emailError"></span>
        </div>
        <div class="form-group mb-2 mt-2">
          <i class="fa-solid fa-key"></i>
          <label for="password">Password:</label>
          <input class="form-control" id="password" type="password" minlength="8" required>
          <span class="error-message" id="passwordError"></span>
        </div>
        <button type="submit" id="menu" class="btn btn-primary">Iniciar sesion</button>
      </form>
      <div id="myAlert" class="alert"></div>
    </main>
  </div>
  <script src="../data/charge_data.js"></script>
  <script src="../assets/scripts/redirection.js"></script>
  <script src="../assets/scripts/validation.js"></script>
</body>
</html>
